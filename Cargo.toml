[package]
name = "pulse"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
description = "PulseTrader core engine — domain types, ports, and adapters"
license = "proprietary"
publish = false

# bin/lib split (audit C1): main.rs and lib.rs compile as SEPARATE crates.
# The binary sees only the library's `pub` API (pub fn run), never pub(crate) internals.
[lib]
name = "pulse"
path = "src/lib.rs"

[[bin]]
name = "pulse"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
rust_decimal = { version = "1", features = ["serde-with-str"] }
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
anyhow = "1"
# WI-1.1.1.02 (binance bulk ingest): HTTP client, archive decode, CSV parse,
# async runtime, and CHECKSUM (SHA256) verification.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
csv = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
hex = "0.4"
# WI-1.1.1.04 (parquet persistence).
polars = { version = "0.53", default-features = false, features = ["parquet"] }
directories = "6"
serde_json = "1"
# Shared by WI-02 (CHECKSUM verify) + WI-04 (data_version hash) — reconciled to one version at merge.
sha2 = "0.11"
# WI-1.1.1.05 (CLI): argument parsing via the derive API.
clap = { version = "4", features = ["derive"] }
# VS-1.1.3 work-3.01 (indicator engine): ta-rs supplies the streaming indicator
# primitives (EMA here; RSI/MACD/ATR in 3.02). EXACT `=` pin (NFR-12): an upgrade
# can shift indicator outputs in low decimals → reproducibility break. The pinned
# version is folded into the future engine_fingerprint. Do NOT relax to a caret.
ta = "=0.5.0"
# VS-1.1.4 work-1.01 (sqlite persistence): the embedded DB tier (WAL pool +
# compile-time-checked queries from 1.03). EXACT `=0.8.6` pin (NFR-12 + gate-7
# C7): a caret `0.8` could pull a patch that changes sqlx's `.sqlx` offline-cache
# format → spurious CI `prepare --check` churn and a reproducibility break. The
# pinned version keys 1.03's committed `.sqlx` cache and joins a future dependency
# fingerprint (mirrors the ta-rs `=0.5.0` determinism pin). Do NOT relax to caret.
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono", "uuid"] }
# VS-1.1.4 work-1.01: id generator for the ADAPTER only (1.03 mints
# `Uuid::new_v4().to_string()` for StrategyId/VersionId); the domain stays
# uuid-free (1.02 uses String newtypes). A floating major-1 pin is fine — uuid is
# not in the engine/dep fingerprint, unlike sqlx.
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# WI-1.1.1.04 — tests write to a tempfile dir, never real Application Support.
tempfile = "3"
# VS-1.1.2 work-2.01 — property-based DSL serde round-trip harness (dev-only;
# not in engine_fingerprint, so a floating "1" pin is fine).
proptest = "1"

# Lints: deny(warnings) + clippy all + pedantic (MASTER-SPEC §7.1, audit C4).
# unwrap/expect denied so library paths cannot panic (audit C5 / AC-7).
[lints.rust]
warnings = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
