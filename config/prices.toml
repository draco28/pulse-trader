# PulseTrader — LLM price table (VS-1.3.2 work-2.03, the "moat in DATA" seam).
#
# NOMINAL ledger estimate — NOT the tariff this deployment is billed at. The
# shipped `[llm]` endpoint below is Z.AI's GLM Coding Plan
# (https://api.z.ai/api/coding/paas/v4), a flat monthly subscription with a
# prompt quota, so no per-token charge is levied per call. The `glm-5.3` figures
# are Z.AI's PUBLISHED per-token rate for the same model on its standard API
# ($1.40 in / $4.40 out per 1M tokens, https://docs.z.ai/guides/overview/pricing,
# retrieved 2026-08-29) — a real, sourced number used as the nominal, so each
# persisted `LlmCall` row's cost is data-tunable (not frozen-in-Rust) and is a
# defensible estimate of what the same traffic would cost per token. A true
# per-token backend (v2) overrides this file via `$PULSE_CONFIG_DIR/prices.toml`.
#
# Moat discipline (VS-1.3.1 decision 4): price VALUES live HERE, as data —
# never as a public Rust literal. The loader (`src/agent/config.rs`) carries
# no price numbers.
#
# Decimal values are quoted STRINGS so `rust_decimal` parses them exactly
# (NFR-2 — no float ever touches a billed figure).

# Native billing currency for the figures below (stored verbatim on `LlmCall`).
currency = "USD"

# Transport pinning (data, not a Rust literal). LIVE as of slice-close FIX A:
# `pulse compose` reads this `[llm]` table via `agent::config::load_llm_transport`
# and drives the provider's base URL + model from it (config → const fallback,
# ADR-0013's one-line model swap). A missing field falls back to the compiled-in
# `openai_compat.rs` / `compose.rs` const. Change the model or endpoint HERE.
[llm]
base_url = "https://api.z.ai/api/coding/paas/v4"
model = "glm-5.3"

# Per-model nominal prices, per 1,000,000 tokens, in `currency`.
# glm-5.3 is the DEVELOPMENT-CYCLE default (Z.AI coding endpoint, OpenAI-compat,
# tool-capable) — walked end-to-end against this endpoint on 2026-08-28. It is the
# current default pending evaluation, NOT a final selection: the glm-5.3 vs
# glm-5.3-flash question is open, and a distributed build does not inherit this
# endpoint at all (ADR-0023 — provider becomes configurable at deployment; GLM stays
# the model family either way).
# glm-5.2 and gpt-oss:120b are retained as nominal alternates ONLY so an operator
# still pointing `[llm]` at Ollama Cloud keeps a priced row. That subscription was
# dropped on 2026-08-29 and ollama.com now answers HTTP 402 for this project, so
# neither alternate is a working configuration — they are here for pricing
# continuity, not as an offer. gpt-oss:120b additionally returned reproducible
# HTTP 500s under multi-turn tool-calling at VS-1.3.2 slice-close.
[models."glm-5.3"]
input_per_mtok = "1.40"
output_per_mtok = "4.40"

[models."glm-5.2"]
input_per_mtok = "0.60"
output_per_mtok = "2.20"

[models."gpt-oss:120b"]
input_per_mtok = "0.50"
output_per_mtok = "1.50"
