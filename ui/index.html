<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1440, initial-scale=1.0" />
    <title>PulseTrader</title>
    <!--
      DELIBERATELY UNSTYLED (r1.s1.w1, spec step 8 / "Out of scope").

      There is no stylesheet here and there must not be one. The design system --
      chrome, sidebar, tokens.css, shared.css and every screen -- is `r1.s1.w5`, which
      replaces this entry point WHOLESALE. Styling the placeholder would create work
      that gets deleted and would make the w5 diff unreadable.

      There is also no `installFit()` and no CSS `transform: scale()`. The window owns
      its own size (1440x900, resizable:false), so the mock's browser-tab fit hack has
      nothing to do here -- and `scripts/check-window-config.sh` (AC-7) fails if one
      reappears.
    -->
  </head>
  <body>
    <main id="app">
      <h1>PulseTrader — shell placeholder</h1>
      <p>
        This page exists to prove the command bus works end to end. It is replaced by
        the real design system in <code>r1.s1.w5</code>.
      </p>

      <section>
        <h2>Round-trip command</h2>
        <pre id="shell-info">loading…</pre>
      </section>

      <section>
        <h2>Error mapping (deliberate failure)</h2>
        <pre id="bus-error">loading…</pre>
      </section>

      <section>
        <h2>Event stream (per-invocation channel)</h2>
        <button id="start-stream" type="button">Start a run</button>
        <pre id="stream-log">idle</pre>
      </section>

      <section>
        <h2>Route table</h2>
        <pre id="routes">loading…</pre>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
